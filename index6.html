<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UL LI Generator PRO</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>
body { font-family: Arial; padding: 10px; }
textarea { width: 100%; height: 200px; margin-bottom: 10px; }
button { padding: 10px 15px; cursor: pointer; }
.nnn { padding: 10px; background: #ddd; }
pre { background: #f4f4f4; padding: 15px; white-space: pre-wrap; }
.info {
  background: #fff;
  padding: 12px;
  margin-bottom: 10px;
  border-left: 4px solid #333;
  font-size: 14px;
}
input, select {
  padding: 6px;
  margin: 5px 0;
  width: 100%;
}
.upload-box {
  margin-bottom: 12px;
}
</style></head><body>
<main><h2>UL LI Generator PRO</h2>
  <br /><h3>URL apa adanya</h3><div class="info">
✔ Input pertama = daftar URL (1 baris = 1 URL)<br>
✔ Input kedua = daftar Keyword<br>
✔ Upload file TXT untuk masing-masing kolom<br>
✔ URL dipakai apa adanya<br>
✔ Hasil: &lt;a href="url"&gt;keyword&lt;/a&gt;<br>
✔ Filter minimal 5 karakter aktif
</div><div class="nnn"><div class="upload-box">
<label><strong>Daftar URL</strong></label>
<textarea id="domain" placeholder="Contoh:
https://site1.com/page1
https://site2.com/page2
https://site3.com/page3"></textarea>
<input type="file" id="uploadUrl" accept=".txt">
</div><div class="upload-box">
<label><strong>Daftar Keyword</strong></label>
<textarea id="input" placeholder="Paste keyword banyak baris di sini..."></textarea>
<input type="file" id="uploadKeyword" accept=".txt">
</div><select id="mode">
  <option value="byParts">Bagi jumlah bagian</option>
  <option value="bySize">Item per bagian</option>
</select><input type="number" id="number" placeholder="contoh: 10 atau 1000"><br><br> <button onclick="generate()">🚀 Generate + Download ZIP</button>

<h3>Preview (sebagian):</h3>
<pre id="output"></pre></div><script>

function escapeHTML(str) {
  return str.replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#39;"
  }[m]));
}

function removeControlChars(str) {
  return str.replace(/[\u0000-\u001F\u007F]/g, "");
}

function cleanText(text) {
  return removeControlChars(text)
    .replace(/\s+/g, " ")
    .trim();
}

function handleFileUpload(inputId, textareaId) {
  const fileInput = document.getElementById(inputId);

  fileInput.addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      document.getElementById(textareaId).value = e.target.result;
    };
    reader.readAsText(file);
  });
}

handleFileUpload("uploadUrl", "domain");
handleFileUpload("uploadKeyword", "input");

async function generate() {
  const rawKeywords = document.getElementById("input").value;
  const mode = document.getElementById("mode").value;
  const num = parseInt(document.getElementById("number").value);

  let urls = document.getElementById("domain").value
    .split("\n")
    .map(u => u.trim())
    .filter(u => u !== "");

  if (urls.length === 0) {
    return alert("Isi daftar URL terlebih dahulu!");
  }

  if (!num || num <= 0) {
    return alert("Isi jumlah!");
  }

  const keywords = rawKeywords
    .split("\n")
    .map(cleanText)
    .filter(k => {
      const count = k.replace(/[^\p{L}\p{N}]/gu, "").length;
      return k !== "" && count >= 5;
    });

  let chunks = [];

  if (mode === "byParts") {
    const base = Math.floor(keywords.length / num);
    const rem = keywords.length % num;
    let start = 0;

    for (let i = 0; i < num; i++) {
      const extra = i < rem ? 1 : 0;
      const end = start + base + extra;
      chunks.push(keywords.slice(start, end));
      start = end;
    }
  } else {
    for (let i = 0; i < keywords.length; i += num) {
      chunks.push(keywords.slice(i, i + num));
    }
  }

  const zip = new JSZip();
  let preview = "";
  let globalIndex = 0;

  chunks.forEach((chunk, i) => {
    if (!chunk.length) return;

    let content = '<ul class="spo">\n';

    chunk.forEach(keyword => {
      const url = urls[globalIndex % urls.length];
      content += '<li><a href="' + escapeHTML(url) + '">' + escapeHTML(keyword) + '</a></li>\n';
      globalIndex++;
    });

    content += '</ul>';

    zip.file(`part-${i + 1}.html`, content);

    if (i < 2) {
      preview += content + "\n\n";
    }
  });

  document.getElementById("output").textContent = preview;

  const blob = await zip.generateAsync({ type: "blob" });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "hasil-ul-url-keyword.zip";
  link.click();
}

</script></main>
</body>
</html>
